name: Build macOS + Windows apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      # Signing + notarization credentials are optional: without them the
      # build still succeeds but produces an unsigned app (fine for testing,
      # not for distribution — see PACKAGING.md). Unset secrets arrive as
      # empty strings, and electron-builder treats an empty CSC_LINK as a
      # certificate path — so only export the variables when actually set.
      - name: Package macOS app (DMG + zip, arm64 + x64)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "Signing certificate found — building signed app"
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            # A certificate was supplied, so signing must succeed: fail the
            # build if it is not a Developer ID Application cert rather than
            # quietly shipping an unsigned artifact under a "signed" run.
            FORCE_SIGN="-c.forceCodeSigning=true"
          else
            echo "No signing certificate configured — building unsigned app"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "Notarization credentials found — will notarize"
            export APPLE_ID="$APPLE_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
          fi
          npx electron-builder --mac --publish never $FORCE_SIGN

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: OhAComber-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      # Built unsigned: Windows shows a SmartScreen prompt that users can
      # click through. Add a code-signing certificate later to remove it.
      - name: Package Windows app (NSIS installer, x64)
        run: npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OhAComber-Windows
          path: release/*.exe
          if-no-files-found: error
