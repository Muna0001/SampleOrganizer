appId: com.muna0001.ohacomber
productName: Oh a comber
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

# Rescues unsigned macOS builds from Gatekeeper's "damaged" error — no-ops when
# a real Developer ID certificate signed the build. See build/adhoc-sign.js.
afterPack: build/adhoc-sign.js

files:
  - dist/**
  - electron/**
  - package.json

# Native modules (better-sqlite3) must live outside the asar archive to load
asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.music
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # Only sign with a Developer ID Application certificate — the one kind that
  # Gatekeeper and notarization accept for apps distributed outside the App
  # Store. Without this qualifier electron-builder falls back to any certificate
  # in the keychain and silently signs a release with an "Apple Development" or
  # "Apple Distribution" cert, which builds fine and is rejected by Apple.
  identity: Developer ID Application
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: "OhAComber-${version}-${arch}.${ext}"
  darkModeSupport: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "OhAComber-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Oh a comber

dmg:
  artifactName: "OhAComber-${version}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Never auto-publish; artifacts are uploaded manually or by CI
publish: null
